; QUORUM firmware — targets share one protocol library (lib/quorum_proto).
;
;   pio run -e mesh    -t upload --upload-port COM3    # ESP-NOW mesh (P1/P2)
;   pio run -e mesh    -t monitor --monitor-port COM3  # watch one board
;   pio run -e agent   -t upload                       # Module-1 USB wire test
;   pio run -e sniffer -t upload                       # RF sniffer (added later)
;
; ONE binary runs on every mesh board — each learns its id from its own MAC via
; include/khoj_ids.h, so there is nothing to change between boards. Flash the
; same `mesh` env to all 5, just changing --upload-port.
;
; If your board isn't a plain WROOM-32 devkit, change `board` below. Common ones:
;   esp32dev            (most WROOM-32 devkits: DevKitC, NodeMCU-32S)
;   nodemcu-32s
;   esp32doit-devkit-v1

[platformio]
default_envs = mesh

[env]
; arduino-esp32 core 3.x via the pioarduino community fork — PINNED ON PURPOSE.
; Official PlatformIO's core stops at 2.0.17, and on 2.0.17 the ESP-NOW receive
; callback gives you (mac, data, len) with NO signal strength. Per-agent RSSI is
; the whole cooperative RF gradient, so core 3.x is a hard requirement, not a
; preference. Verified building here as core 3.3.11 / ESP-IDF 5.5.5.
; If a board ever boots printing `rx_rssi=NO-core2.x`, this line got reverted.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; NOTE: the wire test (sim/wire_test.py) needs the serial port to itself.
; Don't run `-t monitor` at the same time as wire_test.py — only one program
; can own the port.

; ---- the mesh: ESP-NOW bringup + peer table (P1/P2) ------------------------
; The boot line prints `rx_rssi=YES` on core 3.x. Check it once per flash session.
[env:mesh]
build_src_filter = +<mesh/>
build_flags = -Wall

[env:agent]
build_src_filter = +<agent/>

[env:sniffer]
build_src_filter = +<sniffer/>
