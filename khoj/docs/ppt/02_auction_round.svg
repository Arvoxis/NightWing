<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><title>The Auction Round</title><text x="800.0" y="46" font-family="Arial" font-size="30" fill="#12263F" text-anchor="middle" font-weight="bold">THE AUCTION ROUND  —  ONE DECISION, NO LEADER</text><text x="800.0" y="76" font-family="Arial" font-size="16" fill="#6B7F94" text-anchor="middle" font-style="italic">Repeats every ~500 ms on every board, in parallel</text><rect x="60" y="140" width="232" height="196" rx="12" ry="12" fill="#FFFFFF" stroke="#0E8FA0" stroke-width="2.5"/><circle cx="90" cy="170" r="19" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><text x="90" y="176" font-family="Arial" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="194.0" y="176" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">SENSE</text><text x="176.0" y="218.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">laptop sends this board</text><text x="176.0" y="235.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">its private packet:</text><text x="176.0" y="253.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">position · detection · RSSI</text><line x1="296" y1="238.0" x2="297.0" y2="238.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="306.0,238.0 297.0,242.9 297.0,233.1" fill="#6B7F94"/><rect x="310" y="140" width="232" height="196" rx="12" ry="12" fill="#FFFFFF" stroke="#0E8FA0" stroke-width="2.5"/><circle cx="340" cy="170" r="19" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><text x="340" y="176" font-family="Arial" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="444.0" y="176" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">UPDATE BELIEF</text><text x="426.0" y="218.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">drain the 32x32 grid</text><text x="426.0" y="235.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">where I just looked</text><text x="426.0" y="253.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">(my opinion, nobody else's)</text><line x1="546" y1="238.0" x2="547.0" y2="238.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="556.0,238.0 547.0,242.9 547.0,233.1" fill="#6B7F94"/><rect x="560" y="140" width="232" height="196" rx="12" ry="12" fill="#FFFFFF" stroke="#D98829" stroke-width="2.5"/><circle cx="590" cy="170" r="19" fill="#D98829" stroke="#D98829" stroke-width="1"/><text x="590" y="176" font-family="Arial" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="694.0" y="176" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">ANNOUNCE</text><text x="676.0" y="218.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">saw something uncertain?</text><text x="676.0" y="235.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">broadcast it as a TASK</text><text x="676.0" y="253.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">to every peer</text><line x1="796" y1="238.0" x2="797.0" y2="238.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="806.0,238.0 797.0,242.9 797.0,233.1" fill="#6B7F94"/><rect x="810" y="140" width="232" height="196" rx="12" ry="12" fill="#FFFFFF" stroke="#D98829" stroke-width="2.5"/><circle cx="840" cy="170" r="19" fill="#D98829" stroke="#D98829" stroke-width="1"/><text x="840" y="176" font-family="Arial" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="944.0" y="176" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">BID</text><text x="926.0" y="218.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">score EVERY open task:</text><text x="926.0" y="235.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">expected survivors</text><text x="926.0" y="253.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">per second</text><line x1="1046" y1="238.0" x2="1047.0" y2="238.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="1056.0,238.0 1047.0,242.9 1047.0,233.1" fill="#6B7F94"/><rect x="1060" y="140" width="232" height="196" rx="12" ry="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><circle cx="1090" cy="170" r="19" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="1"/><text x="1090" y="176" font-family="Arial" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="1194.0" y="176" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">BROADCAST BIDS</text><text x="1176.0" y="218.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">every board now holds</text><text x="1176.0" y="235.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">every board's bid —</text><text x="1176.0" y="253.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">identical data</text><line x1="1296" y1="238.0" x2="1297.0" y2="238.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="1306.0,238.0 1297.0,242.9 1297.0,233.1" fill="#6B7F94"/><rect x="1310" y="140" width="232" height="196" rx="12" ry="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><circle cx="1340" cy="170" r="19" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="1"/><text x="1340" y="176" font-family="Arial" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="1444.0" y="176" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">DECIDE ALONE</text><text x="1426.0" y="218.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">run the SAME rule:</text><text x="1426.0" y="235.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">highest bid wins,</text><text x="1426.0" y="253.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">tie -&gt; lowest ID</text><rect x="60" y="380" width="1480" height="128" rx="14" ry="14" fill="#DCEDE5" stroke="#2E7D5B" stroke-width="2.5"/><text x="800" y="418" font-family="Arial" font-size="21" fill="#12263F" text-anchor="middle" font-weight="bold">SAME DATA  +  SAME RULE  =  SAME WINNER, computed independently on 5 chips</text><text x="800" y="450" font-family="Arial" font-size="14.5" fill="#2E5266" text-anchor="middle">No board announces the result. No board is asked. There is no referee to kill —</text><text x="800" y="474" font-family="Arial" font-size="14.5" fill="#2E5266" text-anchor="middle">which is exactly why killing any board changes nothing about how the rest decide.</text><text x="800" y="496" font-family="Arial" font-size="12" fill="#6B7F94" text-anchor="middle" font-style="italic">Task allocation class ST-SR-IA (Gerkey &amp; Mataric) solved by a sequential single-item auction.</text><rect x="60" y="540" width="720" height="300" rx="14" ry="14" fill="#FFFFFF" stroke="#12263F" stroke-width="2.5"/><text x="100" y="578" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">ONE BID FUNCTION, EVERY TASK TYPE</text><rect x="100" y="596" width="640" height="56" rx="8" ry="8" fill="#EEF3F7" stroke="#B9C6D3" stroke-width="1.5"/><text x="420" y="632" font-family="Arial" font-size="20" fill="#12263F" text-anchor="middle" font-weight="bold">bid  =  U(task) · exp( -(t + c) / tau )  /  (c + eps)</text><text x="420" y="676" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">c = travel TIME, not distance   ·   tau = 60 s survival decay</text><text x="420" y="698" font-family="Arial" font-size="12.5" fill="#6B7F94" text-anchor="middle" font-style="italic">decay evaluated at ARRIVAL — a survivor reached later is less likely alive</text><circle cx="118" cy="721" r="6" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><text x="136" y="726" font-family="Arial" font-size="13" fill="#12263F" text-anchor="start" font-weight="bold">FRONTIER</text><text x="300" y="726" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">U = A · p · p_det</text><circle cx="118" cy="749" r="6" fill="#D98829" stroke="#D98829" stroke-width="1"/><text x="136" y="754" font-family="Arial" font-size="13" fill="#12263F" text-anchor="start" font-weight="bold">REOBSERVE</text><text x="300" y="754" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">U = H(p) · C_FN · viewpoint</text><circle cx="118" cy="777" r="6" fill="#B8433A" stroke="#B8433A" stroke-width="1"/><text x="136" y="782" font-family="Arial" font-size="13" fill="#12263F" text-anchor="start" font-weight="bold">CONFIRM_RF</text><text x="300" y="782" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">U = 500  (highest)</text><circle cx="118" cy="805" r="6" fill="#6B7F94" stroke="#6B7F94" stroke-width="1"/><text x="136" y="810" font-family="Arial" font-size="13" fill="#12263F" text-anchor="start" font-weight="bold">RELAY</text><text x="300" y="810" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">keep the mesh connected</text><rect x="820" y="540" width="720" height="300" rx="14" ry="14" fill="#F7E0DE" stroke="#B8433A" stroke-width="2.5"/><text x="860" y="578" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">WHEN A BOARD DIES</text><circle cx="880" cy="611" r="14" fill="#B8433A" stroke="#B8433A" stroke-width="1"/><text x="880" y="616" font-family="Arial" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="908" y="616" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">Heartbeats stop arriving.</text><circle cx="880" cy="657" r="14" fill="#B8433A" stroke="#B8433A" stroke-width="1"/><text x="880" y="662" font-family="Arial" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="908" y="662" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">After 2 s of silence, EVERY surviving board independently marks it dead.</text><circle cx="880" cy="703" r="14" fill="#B8433A" stroke="#B8433A" stroke-width="1"/><text x="880" y="708" font-family="Arial" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="908" y="708" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">Its tasks return to the pool — no handover, no election.</text><circle cx="880" cy="749" r="14" fill="#B8433A" stroke="#B8433A" stroke-width="1"/><text x="880" y="754" font-family="Arial" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="908" y="754" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">Next round re-auctions them. Recovery is emergent, not scripted.</text><text x="1180" y="812" font-family="Arial" font-size="13" fill="#B8433A" text-anchor="middle" font-weight="bold">VERIFIED ON HARDWARE: detected in under 2 s, 5 boards</text></svg>