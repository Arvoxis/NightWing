<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><title>Cooperative RF Localization</title><text x="800.0" y="46" font-family="Arial" font-size="30" fill="#12263F" text-anchor="middle" font-weight="bold">COOPERATIVE RF LOCALIZATION  —  FINDING THE INVISIBLE</text><text x="800.0" y="76" font-family="Arial" font-size="16" fill="#6B7F94" text-anchor="middle" font-style="italic">No drone can see the phone. No drone can find it alone.</text><rect x="70" y="116" width="700" height="620" rx="12" ry="12" fill="#EEF3F7" stroke="#B9C6D3" stroke-width="2"/><line x1="140.0" y1="116" x2="140.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="178.0" x2="770" y2="178.0" stroke="#DCE5EC" stroke-width="1"/><line x1="210.0" y1="116" x2="210.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="240.0" x2="770" y2="240.0" stroke="#DCE5EC" stroke-width="1"/><line x1="280.0" y1="116" x2="280.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="302.0" x2="770" y2="302.0" stroke="#DCE5EC" stroke-width="1"/><line x1="350.0" y1="116" x2="350.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="364.0" x2="770" y2="364.0" stroke="#DCE5EC" stroke-width="1"/><line x1="420.0" y1="116" x2="420.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="426.0" x2="770" y2="426.0" stroke="#DCE5EC" stroke-width="1"/><line x1="490.0" y1="116" x2="490.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="488.0" x2="770" y2="488.0" stroke="#DCE5EC" stroke-width="1"/><line x1="560.0" y1="116" x2="560.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="550.0" x2="770" y2="550.0" stroke="#DCE5EC" stroke-width="1"/><line x1="630.0" y1="116" x2="630.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="612.0" x2="770" y2="612.0" stroke="#DCE5EC" stroke-width="1"/><line x1="700.0" y1="116" x2="700.0" y2="736" stroke="#DCE5EC" stroke-width="1"/><line x1="70" y1="674.0" x2="770" y2="674.0" stroke="#DCE5EC" stroke-width="1"/><circle cx="434.0" cy="401.2" r="190" fill="#E7F4F6" stroke="none" stroke-width="0"/><circle cx="434.0" cy="401.2" r="140" fill="#D2EAEE" stroke="none" stroke-width="0"/><circle cx="434.0" cy="401.2" r="92" fill="#B8DFE5" stroke="none" stroke-width="0"/><circle cx="434.0" cy="401.2" r="48" fill="#8FCFD8" stroke="none" stroke-width="0"/><circle cx="434.0" cy="401.2" r="15" fill="#B8433A" stroke="#B8433A" stroke-width="2"/><text x="434.0" y="445.2" font-family="Arial" font-size="14" fill="#B8433A" text-anchor="middle" font-weight="bold">HIDDEN PHONE</text><text x="434.0" y="465.2" font-family="Arial" font-size="12" fill="#6B7F94" text-anchor="middle">no visual signature</text><line x1="150" y1="196" x2="307.4249708387205" y2="309.74508456375156" stroke="#0E8FA0" stroke-width="2.2" stroke-dasharray="7,5"/><polygon points="314.7,315.0 304.5,313.8 310.3,305.7" fill="#0E8FA0"/><circle cx="150" cy="196" r="21" fill="#D6EEF1" stroke="#0E8FA0" stroke-width="2.5"/><text x="150" y="201" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">1</text><text x="150" y="164" font-family="Arial" font-size="12.5" fill="#0E8FA0" text-anchor="middle" font-weight="bold">-71 dBm</text><line x1="680" y1="211" x2="544.440037074217" y2="315.8109957255444" stroke="#0E8FA0" stroke-width="2.2" stroke-dasharray="7,5"/><polygon points="537.3,321.3 541.4,311.9 547.5,319.7" fill="#0E8FA0"/><circle cx="680" cy="211" r="21" fill="#D6EEF1" stroke="#0E8FA0" stroke-width="2.5"/><text x="680" y="216" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">2</text><text x="680" y="179" font-family="Arial" font-size="12.5" fill="#0E8FA0" text-anchor="middle" font-weight="bold">-58 dBm</text><line x1="155" y1="621" x2="309.7503509940793" y2="499.0855657759905" stroke="#0E8FA0" stroke-width="2.2" stroke-dasharray="7,5"/><polygon points="316.8,493.5 312.8,503.0 306.7,495.2" fill="#0E8FA0"/><circle cx="155" cy="621" r="21" fill="#D6EEF1" stroke="#0E8FA0" stroke-width="2.5"/><text x="155" y="626" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">3</text><text x="155" y="661" font-family="Arial" font-size="12.5" fill="#0E8FA0" text-anchor="middle" font-weight="bold">-64 dBm</text><line x1="670" y1="636" x2="539.500161107138" y2="506.16371960998305" stroke="#0E8FA0" stroke-width="2.2" stroke-dasharray="7,5"/><polygon points="533.1,499.8 543.0,502.7 536.0,509.7" fill="#0E8FA0"/><circle cx="670" cy="636" r="21" fill="#D6EEF1" stroke="#0E8FA0" stroke-width="2.5"/><text x="670" y="641" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">4</text><text x="670" y="676" font-family="Arial" font-size="12.5" fill="#0E8FA0" text-anchor="middle" font-weight="bold">-49 dBm</text><circle cx="376.0" cy="355.2" r="11" fill="none" stroke="#D98829" stroke-width="3"/><line x1="356.0" y1="355.2" x2="396.0" y2="355.2" stroke="#D98829" stroke-width="2"/><line x1="376.0" y1="335.2" x2="376.0" y2="375.2" stroke="#D98829" stroke-width="2"/><text x="352.0" y="329.2" font-family="Arial" font-size="12.5" fill="#D98829" text-anchor="end" font-weight="bold">swarm estimate</text><text x="420.0" y="762" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="middle">Each agent samples where it happens to be. Alone, each reading is meaningless.</text><rect x="810" y="116" width="720" height="300" rx="14" ry="14" fill="#FFFFFF" stroke="#12263F" stroke-width="2.5"/><text x="850" y="154" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">THE METHOD  —  GRADIENT, NOT TRILATERATION</text><rect x="850" y="172" width="640" height="92" rx="8" ry="8" fill="#EEF3F7" stroke="#B9C6D3" stroke-width="1.5"/><text x="1170" y="206" font-family="Arial" font-size="19" fill="#12263F" text-anchor="middle" font-weight="bold">w = 10 ^ ( (RSSI + 100) / 20 )</text><text x="1170" y="240" font-family="Arial" font-size="19" fill="#12263F" text-anchor="middle" font-weight="bold">estimate = SUM(w · position) / SUM(w)</text><text x="1170" y="288" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">Pool every agent's sample over the mesh. Weight by signal amplitude,</text><text x="1170" y="310" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">so the strongest readings pull hardest. Fly there. Resample. Converge.</text><text x="1170" y="344" font-family="Arial" font-size="13" fill="#D98829" text-anchor="middle" font-style="italic">A fresh bearing cuts uncertainty far more than a nearby repeat —</text><text x="1170" y="366" font-family="Arial" font-size="13" fill="#D98829" text-anchor="middle" font-style="italic">the same viewpoint-diversity term the vision tasks use. One equation.</text><text x="1170" y="396" font-family="Arial" font-size="13.5" fill="#12263F" text-anchor="middle" font-weight="bold">No path-loss calibration. No geometry requirement. No matrix solve.</text><rect x="810" y="436" width="350" height="300" rx="14" ry="14" fill="#F7E0DE" stroke="#B8433A" stroke-width="2.5"/><text x="985" y="474" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">WHY NOT TRILATERATION</text><text x="985" y="508.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">Needs a calibrated</text><text x="985" y="525.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">path-loss model and</text><text x="985" y="543.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">good geometry.</text><text x="985" y="560.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle"></text><text x="985" y="578.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">Rubble is noisy and</text><text x="985" y="595.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">multipath-wrecked —</text><text x="985" y="613.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">your calibration is</text><text x="985" y="630.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">wrong the moment the</text><text x="985" y="648.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">environment changes.</text><rect x="1180" y="436" width="350" height="300" rx="14" ry="14" fill="#DCEDE5" stroke="#2E7D5B" stroke-width="2.5"/><text x="1355" y="474" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">WHY THE GRADIENT WINS</text><text x="1355" y="508.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">Only ever asks:</text><text x="1355" y="525.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">"stronger here, or</text><text x="1355" y="543.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">there?"</text><text x="1355" y="560.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle"></text><text x="1355" y="578.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">Survives concrete,</text><text x="1355" y="595.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">jamming and a hall</text><text x="1355" y="613.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">full of phones.</text><text x="1355" y="630.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">Cheap enough to run</text><text x="1355" y="648.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">on a $3 chip.</text><rect x="70" y="786" width="1460" height="92" rx="14" ry="14" fill="#FBEEDA" stroke="#D98829" stroke-width="2.5"/><text x="100" y="818" font-family="Arial" font-size="16" fill="#12263F" text-anchor="start" font-weight="bold">ALREADY PROVEN ON HARDWARE</text><text x="100" y="844" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">Every board reads a peer's signal strength directly from the ESP-NOW receive callback — no promiscuous</text><text x="100" y="866" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">mode, no extra radio. Measured live across 5 boards: -23 dBm close, -72 dBm across the room.</text></svg>