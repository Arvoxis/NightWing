<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><rect width="1600" height="940" fill="#FFFFFF"/><title>KHOJ System Architecture</title><text x="800.0" y="46" font-family="Arial" font-size="30" fill="#12263F" text-anchor="middle" font-weight="bold">KHOJ SYSTEM ARCHITECTURE</text><text x="800.0" y="76" font-family="Arial" font-size="16" fill="#6B7F94" text-anchor="middle" font-style="italic">The laptop owns reality. The boards own the decisions. They never swap roles.</text><rect x="90" y="116" width="900" height="168" rx="14" ry="14" fill="#EEF3F7" stroke="#2E5266" stroke-width="2.5"/><text x="120" y="150" font-family="Arial" font-size="19" fill="#12263F" text-anchor="start" font-weight="bold">THE WORLD   ·   laptop</text><rect x="120" y="168" width="195" height="92" rx="8" ry="8" fill="#FFFFFF" stroke="#B9C6D3" stroke-width="1.8"/><text x="217" y="200" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">Physics sim</text><text x="217" y="222" font-family="Arial" font-size="12" fill="#6B7F94" text-anchor="middle">drone bodies, terrain</text><rect x="335" y="168" width="195" height="92" rx="8" ry="8" fill="#FFFFFF" stroke="#B9C6D3" stroke-width="1.8"/><text x="432" y="200" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">RF propagation</text><text x="432" y="222" font-family="Arial" font-size="12" fill="#6B7F94" text-anchor="middle">true phone position</text><rect x="550" y="168" width="195" height="92" rx="8" ry="8" fill="#FFFFFF" stroke="#B9C6D3" stroke-width="1.8"/><text x="647" y="200" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">YOLO detector</text><text x="647" y="222" font-family="Arial" font-size="12" fill="#6B7F94" text-anchor="middle">real aerial imagery</text><rect x="765" y="168" width="195" height="92" rx="8" ry="8" fill="#FFFFFF" stroke="#B9C6D3" stroke-width="1.8"/><text x="862" y="200" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">Dashboard</text><text x="862" y="222" font-family="Arial" font-size="12" fill="#6B7F94" text-anchor="middle">+ lawnmower baseline</text><text x="540" y="274" font-family="Arial" font-size="14" fill="#B8433A" text-anchor="middle" font-weight="bold">holds ground truth  ·  NEVER assigns work</text><rect x="1040" y="116" width="470" height="168" rx="14" ry="14" fill="#FBEEDA" stroke="#D98829" stroke-width="2.5"/><text x="1070" y="150" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">REAL DRONE   ·   one agent, embodied</text><text x="1275" y="186" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">F450 airframe + Pixhawk  (flies)</text><text x="1275" y="204" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">Raspberry Pi: MAVSDK · camera · GPS</text><text x="1275" y="222" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">plays 'the World' onboard, outdoors</text><text x="1275" y="268" font-family="Arial" font-size="13" fill="#D98829" text-anchor="middle" font-weight="bold">same firmware — only the body changes</text><line x1="220" y1="284" x2="220.0" y2="462.0" stroke="#2E5266" stroke-width="2"/><polygon points="220.0,470.0 215.6,462.0 224.4,462.0" fill="#2E5266"/><line x1="435" y1="284" x2="435.0" y2="462.0" stroke="#2E5266" stroke-width="2"/><polygon points="435.0,470.0 430.6,462.0 439.4,462.0" fill="#2E5266"/><line x1="650" y1="284" x2="650.0" y2="462.0" stroke="#2E5266" stroke-width="2"/><polygon points="650.0,470.0 645.6,462.0 654.4,462.0" fill="#2E5266"/><line x1="865" y1="284" x2="865.0" y2="462.0" stroke="#2E5266" stroke-width="2"/><polygon points="865.0,470.0 860.6,462.0 869.4,462.0" fill="#2E5266"/><rect x="920" y="336" width="300" height="74" rx="8" ry="8" fill="#FFFFFF" stroke="#2E5266" stroke-width="2"/><text x="1070" y="362" font-family="Arial" font-size="14" fill="#12263F" text-anchor="middle" font-weight="bold">USB  ·  private, per-agent</text><text x="1070" y="384" font-family="Arial" font-size="12" fill="#6B7F94" text-anchor="middle">sensor packet DOWN  ·  goal UP</text><line x1="1275" y1="284" x2="1275.0" y2="462.0" stroke="#D98829" stroke-width="2"/><polygon points="1275.0,470.0 1270.6,462.0 1279.4,462.0" fill="#D98829"/><text x="1352" y="384" font-family="Arial" font-size="13" fill="#D98829" text-anchor="middle" font-weight="bold">UART</text><rect x="90" y="470" width="1420" height="300" rx="14" ry="14" fill="#FFFFFF" stroke="#0E8FA0" stroke-width="2.5"/><text x="120" y="506" font-family="Arial" font-size="19" fill="#12263F" text-anchor="start" font-weight="bold">THE MINDS   ·   ESP32 agents</text><text x="1480" y="506" font-family="Arial" font-size="13" fill="#0E8FA0" text-anchor="end" font-weight="bold">each holds its OWN belief map</text><rect x="134.0" y="529.0" width="172" height="62" rx="6" ry="6" fill="#D6EEF1" stroke="#0E8FA0" stroke-width="2"/><line x1="162.66666666666666" y1="529.0" x2="162.66666666666666" y2="523.0" stroke="#0E8FA0" stroke-width="2"/><line x1="162.66666666666666" y1="591.0" x2="162.66666666666666" y2="597.0" stroke="#0E8FA0" stroke-width="2"/><line x1="191.33333333333334" y1="529.0" x2="191.33333333333334" y2="523.0" stroke="#0E8FA0" stroke-width="2"/><line x1="191.33333333333334" y1="591.0" x2="191.33333333333334" y2="597.0" stroke="#0E8FA0" stroke-width="2"/><line x1="220.0" y1="529.0" x2="220.0" y2="523.0" stroke="#0E8FA0" stroke-width="2"/><line x1="220.0" y1="591.0" x2="220.0" y2="597.0" stroke="#0E8FA0" stroke-width="2"/><line x1="248.66666666666669" y1="529.0" x2="248.66666666666669" y2="523.0" stroke="#0E8FA0" stroke-width="2"/><line x1="248.66666666666669" y1="591.0" x2="248.66666666666669" y2="597.0" stroke="#0E8FA0" stroke-width="2"/><line x1="277.33333333333337" y1="529.0" x2="277.33333333333337" y2="523.0" stroke="#0E8FA0" stroke-width="2"/><line x1="277.33333333333337" y1="591.0" x2="2