275.0" y1="591.0" x2="1275.0" y2="597.0" stroke="#D98829" stroke-width="2"/><line x1="1303.6666666666667" y1="529.0" x2="1303.6666666666667" y2="523.0" stroke="#D98829" stroke-width="2"/><line x1="1303.6666666666667" y1="591.0" x2="1303.6666666666667" y2="597.0" stroke="#D98829" stroke-width="2"/><line x1="1332.3333333333333" y1="529.0" x2="1332.3333333333333" y2="523.0" stroke="#D98829" stroke-width="2"/><line x1="1332.3333333333333" y1="591.0" x2="1332.3333333333333" y2="597.0" stroke="#D98829" stroke-width="2"/><text x="1275" y="565" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">ON-DRONE</text><line x1="160" y1="656" x2="1440" y2="656" stroke="#0E8FA0" stroke-width="3"/><line x1="220" y1="592" x2="220" y2="656" stroke="#0E8FA0" stroke-width="2"/><circle cx="220" cy="656" r="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><line x1="435" y1="592" x2="435" y2="656" stroke="#0E8FA0" stroke-width="2"/><circle cx="435" cy="656" r="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><line x1="650" y1="592" x2="650" y2="656" stroke="#0E8FA0" stroke-width="2"/><circle cx="650" cy="656" r="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><line x1="865" y1="592" x2="865" y2="656" stroke="#0E8FA0" stroke-width="2"/><circle cx="865" cy="656" r="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><line x1="1080" y1="592" x2="1080" y2="656" stroke="#0E8FA0" stroke-width="2"/><circle cx="1080" cy="656" r="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><line x1="1275" y1="592" x2="1275" y2="656" stroke="#0E8FA0" stroke-width="2"/><circle cx="1275" cy="656" r="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><text x="800" y="692" font-family="Arial" font-size="17" fill="#0E8FA0" text-anchor="middle" font-weight="bold">ESP-NOW MESH   ·   broadcast, no router, no leader</text><text x="800" y="716" font-family="Arial" font-size="13" fill="#6B7F94" text-anchor="middle">bids  ·  awards  ·  heartbeats  ·  RF samples  ·  dismissals</text><text x="800" y="748" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">23-byte packets  ·  5 Hz heartbeat  ·  0.0% measured loss on 5 boards</text><rect x="90" y="802" width="1420" height="96" rx="10" ry="10" fill="#EEF3F7" stroke="#B9C6D3" stroke-width="1.8"/><text x="120" y="834" font-family="Arial" font-size="15" fill="#12263F" text-anchor="start" font-weight="bold">WHY IT IS A SWARM AND NOT A PUPPET SHOW</text><text x="120" y="862" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">The laptop simulates and draws. It never chooses a goal. Every goal on screen was decided</text><text x="120" y="882" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">on a separate microcontroller, from that board's own private belief, and agreed by radio.</text></svg>