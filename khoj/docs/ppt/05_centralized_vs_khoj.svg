<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840"><rect width="1600" height="840" fill="#FFFFFF"/><title>Centralized vs KHOJ</title><text x="800.0" y="46" font-family="Arial" font-size="29" fill="#12263F" text-anchor="middle" font-weight="bold">WHY DECENTRALIZED  —  AND WHY THAT IS THE RIGHT CALL HERE</text><text x="800.0" y="76" font-family="Arial" font-size="15" fill="#6B7F94" text-anchor="middle" font-style="italic">Every 1000-drone light show you have seen is centralized. That architecture cannot do disaster response.</text><rect x="70" y="116" width="700" height="470" rx="14" ry="14" fill="#F7E0DE" stroke="#B8433A" stroke-width="2.5"/><text x="420" y="152" font-family="Arial" font-size="18" fill="#12263F" text-anchor="middle" font-weight="bold">CENTRALIZED   (DJI shows, most military)</text><rect x="342" y="220" width="156" height="58" rx="8" ry="8" fill="#FFFFFF" stroke="#B8433A" stroke-width="2.5"/><text x="420" y="255" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">GROUND STATION</text><line x1="420" y1="280" x2="644.5651600509079" y2="319.51357821262917" stroke="#B8433A" stroke-width="1.8"/><polygon points="652.4,320.9 643.8,323.8 645.3,315.2" fill="#B8433A"/><circle cx="652.4441214720629" cy="334.8999284295485" r="15" fill="#FFFFFF" stroke="#B8433A" stroke-width="2"/><line x1="420" y1="280" x2="577.3641001367222" y2="378.43759432786334" stroke="#B8433A" stroke-width="1.8"/><polygon points="584.1,382.7 575.0,382.2 579.7,374.7" fill="#B8433A"/><circle cx="584.146438938239" cy="396.68022091777664" r="15" fill="#FFFFFF" stroke="#B8433A" stroke-width="2"/><line x1="420" y1="280" x2="475.96378341761977" y2="410.11204365851694" stroke="#B8433A" stroke-width="1.8"/><polygon points="479.1,417.5 471.9,411.9 480.0,408.4" fill="#B8433A"/><circle cx="479.1247492559312" cy="431.46107726634784" r="15" fill="#FFFFFF" stroke="#B8433A" stroke-width="2"/><line x1="420" y1="280" x2="364.03621658238023" y2="410.11204365851694" stroke="#B8433A" stroke-width="1.8"/><polygon points="360.9,417.5 360.0,408.4 368.1,411.9" fill="#B8433A"/><circle cx="360.8752507440688" cy="431.46107726634784" r="15" fill="#FFFFFF" stroke="#B8433A" stroke-width="2"/><line x1="420" y1="280" x2="262.63589986327776" y2="378.43759432786334" stroke="#B8433A" stroke-width="1.8"/><polygon points="255.9,382.7 260.3,374.7 265.0,382.2" fill="#B8433A"/><circle cx="255.85356106176093" cy="396.68022091777664" r="15" fill="#FFFFFF" stroke="#B8433A" stroke-width="2"/><line x1="420" y1="280" x2="195.4348399490921" y2="319.51357821262917" stroke="#B8433A" stroke-width="1.8"/><polygon points="187.6,320.9 194.7,315.2 196.2,323.8" fill="#B8433A"/><circle cx="187.55587852793715" cy="334.8999284295485" r="15" fill="#FFFFFF" stroke="#B8433A" stroke-width="2"/><text x="420" y="470" font-family="Arial" font-size="14" fill="#12263F" text-anchor="middle" font-weight="bold">computes EVERY drone's trajectory  ·  O(N) compute</text><text x="420" y="494" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">one brain  ·  one uplink  ·  one point of failure</text><text x="110" y="528" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">x   Needs RTK-GPS (+/- 2 cm) and a permanent uplink</text><text x="110" y="550" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">x   One failure point — the station dies, the show ends</text><text x="110" y="572" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">x   Useless offline, indoors, or in a collapsed building</text><rect x="830" y="116" width="700" height="470" rx="14" ry="14" fill="#DCEDE5" stroke="#2E7D5B" stroke-width="2.5"/><text x="1180" y="152" font-family="Arial" font-size="18" fill="#12263F" text-anchor="middle" font-weight="bold">KHOJ   (decentralized)</text><line x1="1180.0" y1="182.0" x2="1282.1909976465638" y2="241.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1180.0" y1="182.0" x2="1282.1909976465638" y2="359.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1180.0" y1="182.0" x2="1180.0" y2="418.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1180.0" y1="182.0" x2="1077.8090023534362" y2="359.00000000000006" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1180.0" y1="182.0" x2="1077.8090023534362" y2="241.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1282.1909976465638" y1="241.0" x2="1282.1909976465638" y2="359.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1282.1909976465638" y1="241.0" x2="1180.0" y2="418.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1282.1909976465638" y1="241.0" x2="1077.8090023534362" y2="359.00000000000006" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1282.1909976465638" y1="241.0" x2="1077.8090023534362" y2="241.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1282.1909976465638" y1="359.0" x2="1180.0" y2="418.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1282.1909976465638" y1="359.0" x2="1077.8090023534362" y2="359.00000000000006" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1282.1909976465638" y1="359.0" x2="1077.8090023534362" y2="241.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1180.0" y1="418.0" x2="1077.8090023534362" y2="359.00000000000006" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1180.0" y1="418.0" x2="1077.8090023534362" y2="241.0" stroke="#2E7D5B" stroke-width="1.2"/><line x1="1077.8090023534362" y1="359.00000000000006" x2="1077.8090023534362" y2="241.0" stroke="#2E7D5B" stroke-width="1.2"/><circle cx="1180.0" cy="182.0" r="21" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><text x="1180.0" y="187.0" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">1</text><circle cx="1282.1909976465638" cy="241.0" r="21" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><text x="1282.1909976465638" y="246.0" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">2</text><circle cx="1282.1909976465638" cy="359.0" r="21" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><text x="1282.1909976465638" y="364.0" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">3</text><circle cx="1180.0" cy="418.0" r="21" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><text x="1180.0" y="423.0" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">4</text><circle cx="1077.8090023534362" cy="359.00000000000006" r="21" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><text x="1077.8090023534362" y="364.00000000000006" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">5</text><circle cx="1077.8090023534362" cy="241.0" r="21" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><text x="1077.8090023534362" y="246.0" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">6</text><text x="1180" y="470" font-family="Arial" font-size="14" fill="#12263F" text-anchor="middle" font-weight="bold">each board computes only for ITSELF  ·  O(1), all in parallel</text><text x="1180" y="494" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">peer-to-peer  ·  no station  ·  no uplink  ·  no leader</text><text x="870" y="528" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">+   Runs on a $3 chip that already bolts to an airframe</text><text x="870" y="550" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">+   Kill any node — the rest re-auction its work in ~2 s</text><text x="870" y="572" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">+   Works offline, indoors, in a disaster zone. That is the point.</text><rect x="70" y="616" width="1460" height="190" rx="14" ry="14" fill="#FFFFFF" stroke="#12263F" stroke-width="2.5"/><text x="100" y="654" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">THE HONEST TRADE-OFF   (we say this before a judge asks)</text><text x="100" y="686" font-family="Arial" font-size="14" fill="#2E5266" text-anchor="start">Decentralized does NOT scale to 1000 drones — the radio would saturate — and each decision round</text><text x="100" y="710" font-family="Arial" font-size="14" fill="#2E5266" text-anchor="start">costs ~500 ms instead of being instant. For a 1000-drone light show, centralized is simply better.</text><text x="100" y="746" font-family="Arial" font-size="14.5" fill="#12263F" text-anchor="start" font-weight="bold">For six drones in a collapsed building with no infrastructure and no guarantee every drone survives</text><text x="100" y="770" font-family="Arial" font-size="14.5" fill="#12263F" text-anchor="start" font-weight="bold">the hour, decentralized is not a preference. It is the only architecture that still works.</text></svg>