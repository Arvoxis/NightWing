<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><rect width="1600" height="880" fill="#FFFFFF"/><title>Measured Results</title><text x="800.0" y="46" font-family="Arial" font-size="30" fill="#12263F" text-anchor="middle" font-weight="bold">MEASURED RESULTS  —  AGAINST A REAL BASELINE</text><text x="800.0" y="76" font-family="Arial" font-size="16" fill="#6B7F94" text-anchor="middle" font-style="italic">Identical worlds, identical drone count. The only difference is how they decide.</text><rect x="70" y="116" width="760" height="480" rx="14" ry="14" fill="#FFFFFF" stroke="#B9C6D3" stroke-width="2"/><text x="450" y="154" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">SURVIVORS CONFIRMED  (out of 5)</text><rect x="140" y="240.0" width="52" height="260.0" rx="5" ry="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="0"/><text x="166" y="230.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">5</text><rect x="202" y="344.0" width="52" height="156.0" rx="5" ry="5" fill="#6B7F94" stroke="#6B7F94" stroke-width="0"/><text x="228" y="334.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">3</text><text x="197" y="526" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">seed 0</text><rect x="312" y="240.0" width="52" height="260.0" rx="5" ry="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="0"/><text x="338" y="230.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">5</text><rect x="374" y="292.0" width="52" height="208.0" rx="5" ry="5" fill="#6B7F94" stroke="#6B7F94" stroke-width="0"/><text x="400" y="282.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">4</text><text x="369" y="526" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">seed 3</text><rect x="484" y="240.0" width="52" height="260.0" rx="5" ry="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="0"/><text x="510" y="230.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">5</text><rect x="546" y="344.0" width="52" height="156.0" rx="5" ry="5" fill="#6B7F94" stroke="#6B7F94" stroke-width="0"/><text x="572" y="334.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">3</text><text x="541" y="526" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">seed 7</text><rect x="656" y="292.0" width="52" height="208.0" rx="5" ry="5" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="0"/><text x="682" y="282.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">4</text><rect x="718" y="292.0" width="52" height="208.0" rx="5" ry="5" fill="#6B7F94" stroke="#6B7F94" stroke-width="0"/><text x="744" y="282.0" font-family="Arial" font-size="17" fill="#12263F" text-anchor="middle" font-weight="bold">4</text><text x="713" y="526" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="middle">seed 11</text><line x1="120" y1="500" x2="800" y2="500" stroke="#2E5266" stroke-width="2"/><circle cx="150" cy="556" r="8" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="1"/><text x="166" y="561" font-family="Arial" font-size="14" fill="#12263F" text-anchor="start" font-weight="bold">KHOJ</text><circle cx="260" cy="556" r="8" fill="#6B7F94" stroke="#6B7F94" stroke-width="1"/><text x="276" y="561" font-family="Arial" font-size="14" fill="#2E5266" text-anchor="start">camera-only lawnmower sweep</text><rect x="870" y="116" width="660" height="106" rx="12" ry="12" fill="#D6EEF1" stroke="#0E8FA0" stroke-width="2.5"/><text x="978" y="182" font-family="Arial" font-size="40" fill="#0E8FA0" text-anchor="middle" font-weight="bold">4-5</text><text x="1090" y="164" font-family="Arial" font-size="16" fill="#12263F" text-anchor="start" font-weight="bold">of 5 survivors confirmed</text><text x="1090" y="192" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">baseline: 3-4, every run</text><rect x="870" y="238" width="660" height="106" rx="12" ry="12" fill="#F7E0DE" stroke="#B8433A" stroke-width="2.5"/><text x="978" y="304" font-family="Arial" font-size="40" fill="#B8433A" text-anchor="middle" font-weight="bold">100%</text><text x="1090" y="286" font-family="Arial" font-size="16" fill="#12263F" text-anchor="start" font-weight="bold">RF victim found</text><text x="1090" y="314" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">baseline: never — it has no radio</text><rect x="870" y="360" width="660" height="106" rx="12" ry="12" fill="#DCEDE5" stroke="#2E7D5B" stroke-width="2.5"/><text x="978" y="426" font-family="Arial" font-size="40" fill="#2E7D5B" text-anchor="middle" font-weight="bold">3-4</text><text x="1090" y="408" font-family="Arial" font-size="16" fill="#12263F" text-anchor="start" font-weight="bold">false alarms auto-dismissed</text><text x="1090" y="436" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">before any rescuer was sent</text><rect x="870" y="482" width="660" height="106" rx="12" ry="12" fill="#EEF3F7" stroke="#12263F" stroke-width="2.5"/><text x="978" y="548" font-family="Arial" font-size="40" fill="#12263F" text-anchor="middle" font-weight="bold">0.0%</text><text x="1090" y="530" font-family="Arial" font-size="16" fill="#12263F" text-anchor="start" font-weight="bold">mesh packet loss</text><text x="1090" y="558" font-family="Arial" font-size="13" fill="#2E5266" text-anchor="start">measured across 5 real boards</text><rect x="70" y="632" width="1460" height="210" rx="14" ry="14" fill="#EEF3F7" stroke="#12263F" stroke-width="2.5"/><text x="100" y="670" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">WHAT IS REAL AND WHAT IS SIMULATED   (we draw this line ourselves)</text><text x="110" y="706" font-family="Arial" font-size="15" fill="#2E7D5B" text-anchor="start" font-weight="bold">REAL</text><text x="110" y="730" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">·  The auction running on 5 separate microcontrollers</text><text x="110" y="754" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">·  The ESP-NOW radio link, measured at 0.0% loss</text><text x="110" y="778" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">·  Failure detection and re-auction after a node dies</text><text x="110" y="802" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">·  Per-agent signal strength, live on hardware</text><text x="830" y="706" font-family="Arial" font-size="15" fill="#D98829" text-anchor="start" font-weight="bold">SIMULATED</text><text x="830" y="730" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">·  Terrain — a photograph, not a place</text><text x="830" y="754" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">·  Drone motion — the boards decide, they do not fly</text><text x="830" y="778" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">·  One real F450 flies the confirmation outdoors</text><text x="830" y="806" font-family="Arial" font-size="13.5" fill="#12263F" text-anchor="start" font-weight="bold">This is hardware-in-the-loop. PX4 ships a HITL mode; it is standard practice.</text></svg>