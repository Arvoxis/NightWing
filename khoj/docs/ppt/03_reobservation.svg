<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><title>Re-observation Loop</title><text x="800.0" y="46" font-family="Arial" font-size="30" fill="#12263F" text-anchor="middle" font-weight="bold">THE RE-OBSERVATION LOOP  —  WHY IT IS A SWARM</text><text x="800.0" y="76" font-family="Arial" font-size="16" fill="#6B7F94" text-anchor="middle" font-style="italic">The swarm reasons together about what it thinks it saw</text><text x="90" y="132" font-family="Arial" font-size="15" fill="#2E5266" text-anchor="start">A single camera look returns a confidence. What happens next depends on where it lands:</text><rect x="90" y="152" width="213.0" height="62" rx="8" ry="8" fill="#F7E0DE" stroke="#B8433A" stroke-width="2"/><rect x="303.0" y="152" width="710.0" height="62" rx="0" ry="0" fill="#FBEEDA" stroke="#D98829" stroke-width="2"/><rect x="1013.0" y="152" width="496.99999999999994" height="62" rx="8" ry="8" fill="#DCEDE5" stroke="#2E7D5B" stroke-width="2"/><text x="196.5" y="182" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">0.00 – 0.15</text><text x="196.5" y="202" font-family="Arial" font-size="12" fill="#2E5266" text-anchor="middle">ignore</text><text x="658.0" y="182" font-family="Arial" font-size="15" fill="#12263F" text-anchor="middle" font-weight="bold">0.15 – 0.80   THE UNCERTAIN BAND</text><text x="658.0" y="202" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">too strong to ignore, too weak to trust  -&gt;  becomes an auctioned TASK</text><text x="1261.5" y="182" font-family="Arial" font-size="13" fill="#12263F" text-anchor="middle" font-weight="bold">0.80 – 1.00</text><text x="1261.5" y="202" font-family="Arial" font-size="12" fill="#2E5266" text-anchor="middle">confirm immediately</text><rect x="60" y="268" width="232" height="176" rx="12" ry="12" fill="#FFFFFF" stroke="#D98829" stroke-width="2.5"/><rect x="60" y="268" width="232" height="34" rx="12" ry="12" fill="#D98829" stroke="#D98829" stroke-width="0"/><text x="176" y="291" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Agent 2 sees 0.41</text><text x="176" y="334.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">half-buried shape</text><text x="176" y="351.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">at grid (14, 9)</text><line x1="296" y1="356" x2="297.0" y2="356.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="306.0,356.0 297.0,360.9 297.0,351.1" fill="#6B7F94"/><rect x="310" y="268" width="232" height="176" rx="12" ry="12" fill="#FFFFFF" stroke="#D98829" stroke-width="2.5"/><rect x="310" y="268" width="232" height="34" rx="12" ry="12" fill="#D98829" stroke="#D98829" stroke-width="0"/><text x="426" y="291" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Spawn REOBSERVE</text><text x="426" y="334.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">broadcast as a task;</text><text x="426" y="351.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">value = information gain</text><line x1="546" y1="356" x2="547.0" y2="356.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="556.0,356.0 547.0,360.9 547.0,351.1" fill="#6B7F94"/><rect x="560" y="268" width="232" height="176" rx="12" ry="12" fill="#FFFFFF" stroke="#0E8FA0" stroke-width="2.5"/><rect x="560" y="268" width="232" height="34" rx="12" ry="12" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="0"/><text x="676" y="291" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Agent 5 wins it</text><text x="676" y="334.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">it is closest AND</text><text x="676" y="351.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">approaches from a</text><text x="676" y="369.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">DIFFERENT bearing</text><line x1="796" y1="356" x2="797.0" y2="356.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="806.0,356.0 797.0,360.9 797.0,351.1" fill="#6B7F94"/><rect x="810" y="268" width="232" height="176" rx="12" ry="12" fill="#FFFFFF" stroke="#0E8FA0" stroke-width="2.5"/><rect x="810" y="268" width="232" height="34" rx="12" ry="12" fill="#0E8FA0" stroke="#0E8FA0" stroke-width="0"/><text x="926" y="291" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Second look: 0.63</text><text x="926" y="334.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">only fused if the angle</text><text x="926" y="351.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">differs by &gt; 20 deg</text><text x="926" y="369.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">(independent evidence)</text><line x1="1046" y1="356" x2="1047.0" y2="356.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="1056.0,356.0 1047.0,360.9 1047.0,351.1" fill="#6B7F94"/><rect x="1060" y="268" width="232" height="176" rx="12" ry="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><rect x="1060" y="268" width="232" height="34" rx="12" ry="12" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0"/><text x="1176" y="291" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Log-odds fusion</text><text x="1176" y="334.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">logodds += logit(conf)</text><text x="1176" y="351.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">fused = sigmoid(logodds)</text><text x="1176" y="369.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">-&gt; 0.87</text><line x1="1296" y1="356" x2="1297.0" y2="356.0" stroke="#6B7F94" stroke-width="2.5"/><polygon points="1306.0,356.0 1297.0,360.9 1297.0,351.1" fill="#6B7F94"/><rect x="1310" y="268" width="232" height="176" rx="12" ry="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><rect x="1310" y="268" width="232" height="34" rx="12" ry="12" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0"/><text x="1426" y="291" font-family="Arial" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">CONFIRMED</text><text x="1426" y="334.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">a real survivor,</text><text x="1426" y="351.5" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">found by two drones</text><text x="1426" y="369.0" font-family="Arial" font-size="12.5" fill="#2E5266" text-anchor="middle">that each doubted it</text><rect x="60" y="486" width="720" height="174" rx="14" ry="14" fill="#F7E0DE" stroke="#B8433A" stroke-width="2.5"/><text x="100" y="524" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">THE OTHER OUTCOME  —  DISMISSAL</text><text x="100" y="552" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">Hot machinery reads 0.34, then 0.11 from a second angle.</text><text x="100" y="574" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">Fused it falls below 0.15 — the swarm rules it out.</text><text x="100" y="604" font-family="Arial" font-size="13.5" fill="#12263F" text-anchor="start" font-weight="bold">HIVE-MIND: the dismissal is BROADCAST. Every board records</text><text x="100" y="626" font-family="Arial" font-size="13.5" fill="#12263F" text-anchor="start" font-weight="bold">the spot. No drone ever wastes a second look on it again.</text><text x="100" y="650" font-family="Arial" font-size="13" fill="#B8433A" text-anchor="start" font-style="italic">"The individual forgets; the swarm remembers."</text><rect x="820" y="486" width="720" height="174" rx="14" ry="14" fill="#EEF3F7" stroke="#12263F" stroke-width="2.5"/><text x="860" y="524" font-family="Arial" font-size="17" fill="#12263F" text-anchor="start" font-weight="bold">WHY THIS IS THE WHOLE POINT</text><text x="860" y="552" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">It lets us run the detector at a LOW threshold — catching the</text><text x="860" y="574" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">half-buried and occluded victims a normal system throws away —</text><text x="860" y="596" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">without burying rescuers in false alarms, because every marginal</text><text x="860" y="618" font-family="Arial" font-size="13.5" fill="#2E5266" text-anchor="start">detection gets a second, independent look from a new angle.</text><text x="860" y="650" font-family="Arial" font-size="13.5" fill="#B8433A" text-anchor="start" font-weight="bold">In SAR a false positive costs 3 minutes. A false negative costs a life.</text><rect x="60" y="690" width="1480" height="156" rx="14" ry="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/><text x="800" y="728" font-family="Arial" font-size="20" fill="#12263F" text-anchor="middle" font-weight="bold">"Why is this a swarm and not five drones with a shared to-do list?"</text><text x="800" y="766" font-family="Arial" font-size="15" fill="#2E5266" text-anchor="middle">Because a to-do list divides work. This divides DOUBT. One drone's uncertainty becomes</text><text x="800" y="792" font-family="Arial" font-size="15" fill="#2E5266" text-anchor="middle">another drone's task, priced by how much that second look would reduce what the swarm</text><text x="800" y="818" font-family="Arial" font-size="15" fill="#2E5266" text-anchor="middle">does not yet know — and the conclusion belongs to all of them, not to whoever looked first.</text></svg>